<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.375" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
 <!-- A balance in equilibrium: two amounts weighed against each other, which is
      what the plan variance card does with each pocket and its own line. Same
      pen as coinsSvg.svg. The drawing spans 2.8 to 21.2 across and 3.3 to 20.5
      down, inside the 3 to 21 the siblings use. -->
 <!-- Pivot -->
 <circle cx="12" cy="4.2" r="0.9" />
 <!-- Post and base -->
 <path d="M 12 5.1 V 20.5" />
 <path d="M 8 20.5 H 16" />
 <!-- Beam -->
 <path d="M 5 7.5 H 19" />
 <!-- Left pan: two strings from the beam end to the rim of a bowl -->
 <path d="M 5 7.5 L 2.8 14 M 5 7.5 L 7.2 14" />
 <path d="M 2.8 14 H 7.2 A 2.2 2.2 0 0 1 2.8 14 Z" />
 <!-- Right pan -->
 <path d="M 19 7.5 L 16.8 14 M 19 7.5 L 21.2 14" />
 <path d="M 16.8 14 H 21.2 A 2.2 2.2 0 0 1 16.8 14 Z" />
</svg>
