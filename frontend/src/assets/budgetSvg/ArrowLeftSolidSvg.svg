<!-- Filled with currentColor, unlike the other left arrows (hard-coded #141414 and #F7F7F7), so it inverts with a control on hover.
     No width or height: the stylesheet sizes it from the control's font size. -->
<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
 <path
  d="M2.5 12 10 5.5V9.9h9.5a2.1 2.1 0 0 1 0 4.2H10v4.4z"
  stroke="currentColor"
  stroke-width="1.2"
  stroke-linejoin="round"
  stroke-linecap="round"
 />
</svg>
